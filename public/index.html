<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ULTRON Console</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> ULTRON <small>OSINT · FORENSICS</small></div>
    <div class="status"><small id="mode" class="mode"></small> <span id="status">STANDBY</span></div>
  </header>

  <main>
    <section class="core">
      <button id="orb" class="orb" title="Click and speak a command"><span></span></button>
      <p id="transcript" class="transcript">Click the core and speak, or type a command.</p>
      <form id="cmdForm" class="cmd">
        <input id="cmd" autocomplete="off" placeholder="Ask anything: news, investigate a domain, check a file…" />
        <button>Execute</button>
      </form>
      <div class="chips" id="chips"></div>
      <label class="toggle"><input type="checkbox" id="voiceOn" checked /> Voice replies</label>
      <label class="toggle" style="margin-left:10px"><input type="checkbox" id="autoSearch" /> Auto-approve news &amp; searches</label>
      <div class="toggle" style="margin-top:8px">Voice: <select id="voiceSel"></select></div>
      <input type="file" id="filePick" hidden />
    </section>

    <section id="results" class="results"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="box">
      <h3>AUTHORIZATION REQUIRED</h3>
      <p id="modalText"></p>
      <label id="modalAuthWrap" class="hidden"><input type="checkbox" id="modalAuth" /> I own this system or have written permission to test it.</label>
      <div class="row">
        <button id="deny" class="ghost">Deny</button>
        <button id="approve">Approve</button>
      </div>
      <small>Say "approve" or "deny".</small>
    </div>
  </div>

  <script src="forensics.js"></script>
  <script src="app.js"></script>
</body>
</html>
